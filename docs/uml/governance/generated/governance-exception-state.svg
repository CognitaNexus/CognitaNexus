@startuml
!pragma layout smetana

skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Noto Sans CJK SC"
skinparam dpi 150

[*] - -> 待处理 : 校验失败或证据不足／冲突 [生成处理项]

待处理 - -> 处理中 : 管理员打开并选择处置动作
待处理 - -> 已处理 : 管理员直接给出处置结论 [含依据与操作者]
待处理 - -> 已转人工复核 : 需要更高权限或第二人复核
待处理 - -> 已忽略 : 确认记录无效 [填写忽略理由]
待处理 - -> 待处理 : 新证据到达 [并入同一处理项，证据追加]

处理中 - -> 已处理 : 处置动作成功
处理中 - -> 待处理 : 处置动作失败 [记录失败原因，可重试]
处理中 - -> 已转人工复核 : 转交他人复核
处理中 - -> 已忽略 : 确认记录无效 [填写忽略理由]

已转人工复核 - -> 已处理 : 复核结论生效
已转人工复核 - -> 已忽略 : 复核确认无效
已转人工复核 - -> 待处理 : 退回补充证据

已处理 - -> 待处理 : 出现新证据或更高权限判定 [原记录保留]
已处理 - -> 已处理 : 处置结果同步生效 [检索、门户、统计一致]

已忽略 - -> 待处理 : 出现相反证据 [重新打开，原记录保留]

note right of 待处理
  待处理项超过约定待办时限时标记超期，
  原始证据不得丢失（FR09-S11 E3）
end note

note bottom of 已处理
  处置必须留痕：操作者、时间、依据与关键变化（BR-381）
  留痕只追加、不覆盖（BR-382）
  同一处理项不得并列重复（FR09-S11 E4）
end note
@enduml

