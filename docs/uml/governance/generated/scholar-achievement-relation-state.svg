@startuml
!pragma layout smetana

skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Noto Sans CJK SC"
skinparam dpi 150

[*] - -> 自动关联 : 来源记录建立参与关系 [有可追溯来源依据]

自动关联 - -> 本人确认 : 学者提交本人确认 [确认范围覆盖该关系]
自动关联 - -> 待核验 : 证据不足或无法定位学者
自动关联 - -> 已排除 : 管理员排除错误归属 [记录依据]
自动关联 - -> 自动关联 : 来源更新一致内容 [不改变确认状态]

待核验 - -> 自动关联 : 管理员核验通过 [无本人确认且冲突已解决]
待核验 - -> 本人确认 : 本人确认生效 [覆盖本关系且冲突已解决]
待核验 - -> 已排除 : 管理员确认非本人成果 [记录依据]
待核验 - -> 争议 : 出现相反归属主张

本人确认 - -> 待核验 : 出现与确认冲突的新证据
本人确认 - -> 已排除 : 学者申请解除并审核通过
本人确认 - -> 争议 : 来源证据与本人确认冲突

争议 - -> 已排除 : 管理员判定排除
争议 - -> 自动关联 : 管理员核验归属成立 [无本人确认]
争议 - -> 本人确认 : 争议已解决 [有效本人确认覆盖本关系]
争议 - -> 争议 : 追加冲突证据 [状态保持]

已排除 - -> [*]

note right of 已排除
  优先级最高：已排除 > 争议 > 待核验 > 本人确认 > 自动关联
  低优先级证据不得自动改变已排除状态（BR-356）
  解除个人关联只终止本关系，
  不删除成果实体、出处与他人关系（BR-359）
end note

note bottom of 自动关联
  认领通过不改变本状态；
  门户认领状态与关系确认状态分别表达（BR-350）
end note
@enduml

