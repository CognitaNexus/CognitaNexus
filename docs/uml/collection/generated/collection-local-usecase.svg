@startuml
skinparam monochrome true
skinparam shadowing false
skinparam dpi 150
!pragma layout smetana
left to right direction
title DGM-USECASE-03 采集与更新局部用例图

actor "管理员" as Admin
actor "访客" as Visitor
actor "外部数据来源" as Source

rectangle "CognitaNexus（第②成员责任范围）" {
  usecase "UC-18 管理数据来源与采集任务\nFR08-S01～S04" as UC08
  usecase "UC-19 更新来源数据并处理变更\nFR10-S01～S05" as UC10
  usecase "UC-16 查看四类成果与来源证据\nFR16-S01～S03" as UC16
}

Admin - - UC08
Admin - - UC10
Admin - - UC16
Visitor - - UC16
Source - - UC08
Source - - UC10

note bottom of UC16
公开浏览复用 FR01/FR02/FR03。
管理员核对覆盖和受控输入证据。
登录及门户授权不授予任务管理权。
end note

legend bottom
本图是局部视图，合并到全组唯一总体用例图。
系统、调度器不作为外部参与者。
endlegend
@enduml

