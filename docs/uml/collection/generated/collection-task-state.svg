@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Noto Sans CJK SC"
skinparam defaultFontSize 16
skinparam dpi 150
title DGM-STATE-01 采集任务
state "待执行" as Pending
state "运行中" as Running
state "成功" as Success
state "失败" as Failed
state "重试" as Retry
state "已停止" as Stopped
[*] - -> Pending : 创建 [权限/来源/范围有效]
Pending - -> Running : 启动 [复核通过]
Pending - -> Stopped : 停止 [决定生效]
Running - -> Success : 读取结束 [已读全部处置]
Running - -> Failed : 取得/处理失败 [未完成]
Running - -> Stopped : 停止 [先于完成生效]
Failed - -> Retry : 重试 [执行条件有效]
Retry - -> Running : 恢复准备 [通过]
Retry - -> Failed : 恢复准备 [失败]
Retry - -> Stopped : 停止 [决定生效]
Success - -> [*]
Stopped - -> [*]
legend bottom
  处置=入库/可追踪异常移交/转待核验，交接失败不算完成。
  成功不等于全部公开；单列待核验、异常及未公开数量。
  失败/停止保留已完成项；重试不增实体和唯一出处。
  成功/停止后另建关联任务；停止与完成按先生效裁定。
  依据：现行FR08/FR10、SRS第6.2节、BR-IMP-04。
endlegend
@enduml

