@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Noto Sans CJK SC"
skinparam dpi 150

skinparam defaultFontSize 14
skinparam state {
  BackgroundColor white
}
title 认领申请状态图 · Draft\n对象：单份认领申请，不是门户或授权

state "待审核" as Pending
state "待补充" as Supplement
state "已通过" as Approved
state "已驳回" as Rejected

[*] - -> Pending : 本人提交 [基本校验通过]\n/ 已有管理人则标记冲突，保留原授权
Pending - -> Supplement : 管理员要求补充 [仍待审核]\n/ 记录补充原因与要求
Supplement - -> Pending : 本人补充并重新提交 [校验通过]
Supplement - -> Supplement : 本人重提 [校验失败]\n/ 返回原因，保持待补充
Pending - -> Pending : 复核发现冲突 [尚未解决]\n/ 记录原因，保留原授权，待人工处理
Pending - -> Approved : 管理员批准 [核验通过、无未解决冲突\n且当前状态有效、授权处理成功]\n/ 记录通过理由，授予目标门户权
Pending - -> Rejected : 管理员驳回 [仍待审核且有原因]\n/ 记录原因，不改变原授权
Approved - -> [*]
Rejected - -> [*]

note right of Supplement
  未重提时保持待补充。
  补充不是直接通过。
  不规定超时自动终结。
end note

note bottom of Approved
  终态记录仍可由本人查询。
  重复审核不得再次授予权限。
  再次申请规则见 J03。
end note

legend bottom
  本人可查询进度、原因及结果；查询不改变状态。
  提交校验失败不创建待审核申请；过期决定被拒绝，不产生迁移。
  冲突是标记，不是新状态；最终处置依 J03 联合冻结，不自动转移授权。
  已驳回只作用于本申请，不使已有管理人的门户变为未认领。
  撤回为 J04 待决能力：候选源状态、已撤回终态和竞态见 SRS §6.4。
  当前不绘制撤回迁移，避免将候选承诺当成已确定业务规则。
endlegend
@enduml

