@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Noto Sans CJK SC"
skinparam defaultFontSize 16
skinparam dpi 150
title DGM-STATE-02 认领申请
state "待审核" as Pending
state "待补充" as Supplement
state "争议" as Dispute
state "已通过" as Approved
state "已驳回" as Rejected
[*] - -> Pending : 本人提交 [有效]
Pending - -> Supplement : 要求补证 [有权且有效]
Supplement - -> Pending : 本人重提 [校验通过]
Pending - -> Dispute : 发现冲突 [未解决]
Dispute - -> Supplement : 要求补证 [有权且有效]
Dispute - -> Pending : 人工结案 [冲突消除]
Dispute - -> Rejected : 人工驳回 [理由完整]
Pending - -> Approved : 批准 [无冲突且授权成功]
Pending - -> Rejected : 驳回 [有权且理由完整]
Pending - -> Pending : 审核/授权提交 [过期或授予失败]\n/ 拒绝决定，保持原状态
Approved - -> [*]
Rejected - -> [*]
legend bottom
  事件 [守卫]；审核必须校验当前版本和权限。
  过期审核/授权失败不改变原状态；不得虚报通过。
  争议未决保留原授权；结案后重新审核，不自动转移。
  未补证或超时保留待办；SLA/撤回/申诉仍待签认。
endlegend
@enduml

