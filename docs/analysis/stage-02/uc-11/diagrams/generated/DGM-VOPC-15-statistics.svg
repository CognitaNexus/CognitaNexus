tLength="1071.875" x="21.875" y="1463.4367">Rel 0..*→1 Work：一条参与关系只属于一项成果，一项成果可有多条参与关系（沿用 UC-02/UC-03/UC-10）。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="21.875" lengthAdjust="spacingAndGlyphs" textLength="1229.6875" x="21.875" y="1495.1116">Work 0..*→0..* Inst：一项成果的“成果发生时机构归属”可有零个（缺失/无证据→机构未知）或多个（不同机构各计一次），</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="21.875" lengthAdjust="spacingAndGlyphs" textLength="740.625" x="21.875" y="1526.7864">一个机构可对应多项成果；同一机构在同一成果上只计一次（BR-IMP-06）。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="21.875" lengthAdjust="spacingAndGlyphs" textLength="1692.1875" x="21.875" y="1558.4613">参与者级机构原值（Authorship 的多机构原值）写成 Authorship 属性，不另画 Authorship→Institution 边，避免与 Work→Institution 重复表达同一归属事实（05 §2.3）。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="21.875" lengthAdjust="spacingAndGlyphs" textLength="642.1875" x="21.875" y="1590.1361">控制/边界到实体的关联按消息方向表达协作，不定义持久多重性。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="21.875" lengthAdjust="spacingAndGlyphs" textLength="1439.0625" x="21.875" y="1621.811">本图无持久“统计结果/统计快照/口径版本”类，无 DTO、报表、图表数据类：统计视图是读时投影（分析态），不是业务实体（05 §4；07 §5）。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="21.875" lengthAdjust="spacingAndGlyphs" textLength="1225" x="21.875" y="1653.4859">本图无 SourceRecord/WorkVersion 消息：来源数、版本数都不参与计数，只作为 WorkEntity 的追溯属性（BR-IMP-02/06）。</text><text fill="#000000" font-family="Noto Sans CJK SC" font-size="21.875" lengthAdjust="spacingAndGlyphs" textLength="773.4375" x="21.875" y="1685.1607">本图无质量评分、影响力或机构优劣排序类：只做计数与并列排名（BR-522）。</text><!--MD5=[f930f098de765e8f85034ad2bc4d393e]
@startuml
skinparam monochrome true
skinparam shadowing false
skinparam defaultFontName "Noto Sans CJK SC"
skinparam defaultFontSize 14
skinparam dpi 150
skinparam classAttributeIconSize 0
skinparam nodesep 70
skinparam ranksep 110
hide circle
hide empty members
top to bottom direction
title DGM-VOPC-15 UC-11 查看成果统计（参与类类图）
boundary "StatisticsUI" as UI
control "StatisticsCoordinator" as Ctl
entity "WorkEntity" as Work
entity "Authorship" as Rel
entity "Institution" as Inst
UI - -> Ctl : M2/M15/M30/M35 请求；其余为返回
Ctl ..> Work : M4 只读
Ctl ..> Rel : M20 只读
Ctl ..> Inst : M23 只读
Rel "0..*" - -> "1" Work : 归属成果
Work "0..*" - -> "0..*" Inst : 成果发生时机构归属（有证据）
legend right
  只包含 UC-11 顺序图中的 5 个参与对象；访客是参与者，不画成系统类。
  边上的编号对应 04 逐消息表：M2/M15/M30/M35 请求；M12/M16/M27/M32/M36/M39/M41/M43/M45/M47/M49 返回；
  M4 只读读取去重成果实体与共享字段（不写、不删除、不合并）；M20 只读读取参与者角色/顺序/发生时机构原值（不写关系状态）；
  M23 只读读取机构规范名、别名与合并映射（不写机构）。
  Rel 0..*→1 Work：一条参与关系只属于一项成果，一项成果可有多条参与关系（沿用 UC-02/UC-03/UC-10）。
  Work 0..*→0..* Inst：一项成果的“成果发生时机构归属”可有零个（缺失/无证据→机构未知）或多个（不同机构各计一次），
  一个机构可对应多项成果；同一机构在同一成果上只计一次（BR-IMP-06）。
  参与者级机构原值（Authorship 的多机构原值）写成 Authorship 属性，不另画 Authorship→Institution 边，避免与 Work→Institution 重复表达同一归属事实（05 §2.3）。
  控制/边界到实体的关联按消息方向表达协作，不定义持久多重性。
  本图无持久“统计结果/统计快照/口径版本”类，无 DTO、报表、图表数据类：统计视图是读时投影（分析态），不是业务实体（05 §4；07 §5）。
  本图无 SourceRecord/WorkVersion 消息：来源数、版本数都不参与计数，只作为 WorkEntity 的追溯属性（BR-IMP-02/06）。
  本图无质量评分、影响力或机构优劣排序类：只做计数与并列排名（BR-522）。
endlegend
@enduml

