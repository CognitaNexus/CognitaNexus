name: Historical V1.0 Word rebuild (manual only)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  document-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc libreoffice-writer poppler-utils fonts-noto-cjk graphviz plantuml librsvg2-bin
      - name: Rebuild historical copy without overwriting delivery
        run: |
          mkdir /tmp/historical-srs-qa
          pandoc --resource-path=docs/srs:docs:. -f gfm -t docx -s docs/srs/CognitaNexus-Shared-SRS-V1.0-RC.md -o /tmp/historical-srs-qa/CognitaNexus-Shared-SRS-V1.0-RC.docx
          unzip -t /tmp/historical-srs-qa/*.docx
      - uses: actions/upload-artifact@v4
        with:
          name: historical-srs-word
          path: /tmp/historical-srs-qa/
