name: Build shared SRS Word
on:
  push:
    branches:
      - docs/shared-srs-semantic-map-20261012
  workflow_dispatch:
permissions:
  contents: write
jobs:
  word:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Install document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc libreoffice-writer poppler-utils librsvg2-bin fonts-noto-cjk
      - name: Convert complete Markdown into DOCX
        run: |
          pandoc --resource-path=docs/srs:docs:. -f gfm -t docx -s docs/srs/CognitaNexus-Shared-SRS-V1.0-RC.md -o docs/srs/CognitaNexus-Shared-SRS-V1.0-RC.docx
          unzip -t docs/srs/CognitaNexus-Shared-SRS-V1.0-RC.docx | tail -2
      - name: Validate source and document correspondence
        run: |
          python - <<'PY'
          import re,zipfile,xml.etree.ElementTree as ET
          from pathlib import Path
          md=Path('docs/srs/CognitaNexus-Shared-SRS-V1.0-RC.md').read_text()
          doc=Path('docs/srs/CognitaNexus-Shared-SRS-V1.0-RC.docx')
          with zipfile.ZipFile(doc) as z:
              assert z.testzip() is None
              xml=z.read('word/document.xml').decode('utf-8')
              ET.fromstring(xml)
          ids=lambda s:set(re.findall(r'AC-(?:FR|IN|NF|O)\d{2}-S\d{2}-\d{2}',s))
          assert ids(md)==ids(xml),(len(ids(md)),len(ids(xml)))
          assert doc.stat().st_size>100000
          media=[n for n in z.namelist() if n.startswith('word/media/')]
          assert len(media)>=10, f'Expected >=10 embedded UML media, found {len(media)}'
          print('PASS embedded diagrams:',len(media))
          print('PASS DOCX ZIP/XML and all AC identifiers',len(ids(xml)))
          PY
      - name: Render Word for layout smoke check
        run: |
          mkdir -p /tmp/srs-preview
          libreoffice -env:UserInstallation=file:///tmp/lo-shared-srs --headless --convert-to pdf --outdir /tmp/srs-preview docs/srs/CognitaNexus-Shared-SRS-V1.0-RC.docx
          pdfinfo /tmp/srs-preview/CognitaNexus-Shared-SRS-V1.0-RC.pdf | grep Pages:
          pdftoppm -f 1 -l 1 -r 90 -png -singlefile /tmp/srs-preview/CognitaNexus-Shared-SRS-V1.0-RC.pdf /tmp/srs-preview/first-page
          PAGES=$(pdfinfo /tmp/srs-preview/CognitaNexus-Shared-SRS-V1.0-RC.pdf | awk '/^Pages:/ {print $2}')
          HALF=$((PAGES/2))
          pdftoppm -f "$HALF" -l "$HALF" -r 90 -png -singlefile /tmp/srs-preview/CognitaNexus-Shared-SRS-V1.0-RC.pdf /tmp/srs-preview/middle-page
          pdftoppm -f "$PAGES" -l "$PAGES" -r 90 -png -singlefile /tmp/srs-preview/CognitaNexus-Shared-SRS-V1.0-RC.pdf /tmp/srs-preview/last-page
          test -s /tmp/srs-preview/first-page.png
      - name: Commit generated Word
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/srs/CognitaNexus-Shared-SRS-V1.0-RC.docx
          git diff --cached --quiet || (git commit -m 'docs(srs): render shared SRS Word RC' && git push)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: shared-srs-document-qa
          path: |
            /tmp/srs-preview/*.png
            /tmp/srs-preview/*.pdf
            docs/srs/CognitaNexus-Shared-SRS-V1.0-RC.docx
          if-no-files-found: ignore
