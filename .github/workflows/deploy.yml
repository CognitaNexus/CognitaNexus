name: build-and-deploy

# 推 dev 分支即构建三个服务与前端，构建通过后再传到目标机换产物。
#
# ---------------------------------------------------------------------------
# 2026-10-23 重构：CI 与 CD 拆成两个 job
#
# 原来是一个 job 从头走到尾。问题不在于慢，而在于**耦合**：目标机换掉之后，
# 部署那一段必然失败，于是整个 job 报红，而「构建过、测试过、门禁过」这件事
# 被同一个红叉吞掉了——看板上分不清是代码坏了还是机器没了。实际情况是后者，
# 而且持续了两天没人发现（10-22 换机后 CI 一次都没跑过）。
#
# 拆开之后语义明确：
#   build   只判「这份代码能不能上」。失败 = 代码问题，必须修。
#   deploy  只判「能不能送到机器上」。失败 = 环境问题，机器修好就能重跑。
# deploy 通过 needs 依赖 build，build 红了 deploy 根本不启动。
#
# 顺带解掉三处与新机不匹配的东西（详见 ops/deploy/REBUILD-2026-10-22.md）：
#   1. 暂存目录不再写死 /home/ubuntu/cn-incoming，改成连上之后用远端 $HOME 推导；
#   2. 不再要求服务器上预先存在 ~/cn-deploy/deploy-update.sh —— 直接用本次产物里的
#      那份，杜绝「仓库改了、服务器上是旧副本」；
#   3. 需要 sudo 的三步（备份定时器、日志上限、nginx 路由）先探测远端能力，
#      没 sudo 就跳过并留 ::warning:: 注解，而不是让整个部署红掉。
# ---------------------------------------------------------------------------
on:
  push:
    branches: [dev]
  workflow_dispatch:

# 连续推送时只保留最新一次，避免两次部署交叉执行把产物换乱。
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建后端（含全部单测与覆盖率门禁）
        # 这里曾是 -DskipTests package，理由是与「部署要快」权衡。已经不值得了：
        # 两次真实事故都落在「测试本该拦、而部署前没人跑」这一类上——一次是改配置类多加了
        # 一个构造器导致 ingestion 启动崩溃、线上循环重启 6 次；一次是 springdoc 与 Spring
        # 版本错配让三个服务的文档全 500，编译期完全看不出来。
        # verify 会跑 spotless、全部单测与 JaCoCo 覆盖率门禁，代价约一分半。
        # 注意 verify 本身包含 package 阶段，产物路径不变，后面的挑包逻辑不用改。
        run: |
          set -o pipefail
          chmod +x mvnw
          ./mvnw -B verify 2>&1 | tee /tmp/cn-build.log | tail -30

      - name: 报告测试计数
        # 把 surefire 的汇总行写进 workflow annotation。GitHub 的完整日志要登录才看得到，
        # 而 check-runs/annotations 匿名可读；没有这一行，「CI 到底跑没跑测试」只能靠猜，
        # 而「测试被静默跳过」恰恰是最不该靠猜的事。
        if: always()
        run: |
          s=$(grep -hE "Tests run: [0-9]+, Failures: [0-9]+, Errors: [0-9]+, Skipped: [0-9]+$" /tmp/cn-build.log | tr '\n' ' ')
          echo "::notice title=后端测试汇总::${s:-未找到测试汇总行（构建可能未跑到测试阶段）}"

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        run: |
          set -o pipefail
          cd frontend
          npm ci --no-audit --no-fund 2>&1 | tail -5
          npm run build 2>&1 | tee /tmp/cn-web.log | tail -20

      - name: 整理产物
        # 每个服务只取一个可执行 jar：排除 *-sources.jar / *-javadoc.jar / *.jar.original，
        # 否则 cp 一次匹配到多个文件会变成「把多个文件拷进一个目标名」，直接失败。
        run: |
          set -eu
          mkdir -p out/app out/web
          pick() {
            f=$(find "services/$1-service/target" -maxdepth 1 -name "$1-service-*.jar" \
                  ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*.jar.original' | head -1)
            [ -n "$f" ] || { echo "未找到 $1-service 的可执行 jar" >&2; exit 1; }
            cp "$f" "out/app/$1-service.jar"
            echo "$1-service.jar <= $f"
          }
          pick core
          pick query
          pick ingestion
          cp -r frontend/dist/. out/web/
          # 部署脚本随产物一起发下去：服务器上那份是首次安装时留下的旧副本，
          # 仓库里改了却不生效，排查起来很费时间。
          cp ops/deploy/deploy-update.sh out/
          # 前端同步助手的一次性安装脚本：需要 root 执行，CI 只负责送到机器上。
          cp ops/deploy/install-web-sync.sh out/
          cp ops/deploy/pg-backup.sh ops/deploy/install-backup.sh out/
          cp ops/deploy/install-logging.sh out/
          cp ops/deploy/nginx-cn.conf ops/deploy/install-nginx.sh out/
          mkdir -p out/systemd
          cp ops/deploy/systemd/cn-db-backup.service ops/deploy/systemd/cn-db-backup.timer out/systemd/
          du -sh out out/app out/web

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: cn-dist
          path: out/
          retention-days: 7
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: cn-dist
          path: out

      - name: 准备 SSH
        env:
          CN_SSH_HOST: ${{ secrets.CN_SSH_HOST }}
          CN_SSH_USER: ${{ secrets.CN_SSH_USER }}
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
          CN_SSH_PORT: ${{ secrets.CN_SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${CN_SSH_HOST:-}" ] || [ -z "${CN_SSH_USER:-}" ] || [ -z "${CN_SSH_KEY:-}" ]; then
            echo "::error::Secrets 缺失：需要 CN_SSH_HOST / CN_SSH_USER / CN_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          # 多行私钥从网页粘进 Secrets 极易受损，实测过的三种：
          #   1) 只丢首尾两行标识，剩下 5 行密钥体（真遇上了：349 字节 / 5 行，
          #      而完整文件是 419 字节 / 7 行，差值正好是两行标识加换行）
          #   2) 换行被存成字面量 \n
          #   3) 存成一行 base64
          # 所以按四种存法依次试，命中即用。
          printf '%s\n' "$CN_SSH_KEY" > /tmp/key-raw
          tr -d '\r' < /tmp/key-raw > /tmp/key-crlf
          sed 's/\\n/\n/g' /tmp/key-crlf > /tmp/key-nl
          # 缺首尾标识时补回来，这是唯一不需要人工重新粘贴的修法
          if ! grep -q 'BEGIN .*PRIVATE KEY' /tmp/key-nl; then
            {
              echo '-----BEGIN OPENSSH PRIVATE KEY-----'
              cat /tmp/key-nl
              echo '-----END OPENSSH PRIVATE KEY-----'
            } > /tmp/key-wrap
          fi
          tr -d ' \t\r\n' < /tmp/key-nl | base64 -d > /tmp/key-b64 2>/dev/null || true
          # 解码结果若刚好缺末尾换行，ssh-keygen 会报 libcrypto: unsupported（已实测），
          # 补一个换行即可；多一个空行对解析无影响。
          [ -s /tmp/key-b64 ] && printf '\n' >> /tmp/key-b64 || true

          ok=""
          for cand in /tmp/key-crlf /tmp/key-nl /tmp/key-wrap /tmp/key-b64; do
            [ -s "$cand" ] || continue
            chmod 600 "$cand"
            if ssh-keygen -y -f "$cand" > ~/.ssh/cn_deploy.pub 2>/tmp/cn-key.err; then
              cp "$cand" ~/.ssh/cn_deploy
              ok="$cand"
              break
            fi
          done
          if [ -z "$ok" ]; then
            # 日志要登录才能看，所以把诊断信息做成注解（未登录也能通过 API 读到）。
            # sha256 只用于和本地正确私钥比对，不泄露内容。
            printf '::error::CN_SSH_KEY 四种存法都解析失败：%s\n' "$(tr '\n' ' ' < /tmp/cn-key.err | cut -c1-200)"
            printf '::error::诊断 字节=%s 行=%s 首行=[%s] 末行=[%s] sha256=%s\n' \
              "$(wc -c < /tmp/key-crlf)" \
              "$(wc -l < /tmp/key-crlf)" \
              "$(head -1 /tmp/key-crlf | cut -c1-30)" \
              "$(tail -1 /tmp/key-crlf | cut -c1-30)" \
              "$(sha256sum /tmp/key-crlf | cut -c1-32)"
            exit 1
          fi
          chmod 600 ~/.ssh/cn_deploy
          printf '::notice::私钥取自 %s，公钥指纹 %s\n' "$ok" "$(ssh-keygen -lf ~/.ssh/cn_deploy.pub | awk '{print $2}')"
          {
            echo "Host cn-target"
            echo "  HostName $CN_SSH_HOST"
            echo "  User $CN_SSH_USER"
            echo "  Port ${CN_SSH_PORT:-22}"
            echo "  IdentityFile ~/.ssh/cn_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          # 15 秒内连不上就当场失败，而不是挂到 job 超时
          # 注意这里只能写远端变量：单引号内的 $ 由远端 shell 展开，
          # 写 $CN_SSH_USER 会得到空串（那是 runner 的环境变量，远端没有）。
          ssh -F ~/.ssh/config -o ConnectTimeout=15 -o BatchMode=yes cn-target \
            'echo "已连上 $(hostname)"' 2>&1 | tee /tmp/cn-ssh.log

      - name: 探测远端部署环境
        # 目标机的能力决定后面能做什么：家目录在哪、有没有 sudo。
        # 探测结果写进 GITHUB_ENV，后面的步骤据此分支——不靠这里写死用户名与路径。
        #
        # 两个坑都要避开：
        #   1. 写进 GITHUB_ENV 的变量在**当前** shell 里并不存在（下一步才生效），
        #      所以必须先落到本步的局部变量再落盘，否则 set -u 直接以
        #      「CN_HAS_SUDO: unbound variable」退出——这就是第一次跑挂在这里的原因。
        #   2. while 循环体里的 `[ -n "$k" ] && echo` 遇到空行会返回 1，
        #      在 set -e 下同样会退出，所以用 case 而不是条件短路。
        run: |
          set -euo pipefail
          info="$(ssh -F ~/.ssh/config -o BatchMode=yes -o ConnectTimeout=15 cn-target \
            'printf "REMOTE_HOME=%s\nHAS_SUDO=%s\n" "$HOME" "$(sudo -n true 2>/dev/null && echo yes || echo no)"')"
          echo "$info"
          remote_home=""
          has_sudo=""
          while IFS='=' read -r k v; do
            case "$k" in
              REMOTE_HOME) remote_home="$v" ;;
              HAS_SUDO)    has_sudo="$v" ;;
            esac
          done <<< "$info"
          if [ -z "$remote_home" ]; then
            echo "::error::取不到远端家目录，远端返回：$info"
            exit 1
          fi
          [ "$has_sudo" = "yes" ] || has_sudo="no"
          # 前端能不能自动部署，决定这一轮是「严格模式」还是「跳过前端」。
          # 跳过必须是显式的：deploy-update.sh 默认在前端有变化而无同步能力时直接失败，
          # 只有 CI 明确传 CN_SKIP_WEB=1 才降级成「只发后端 + 告警」。
          # 这样人工跑仍然是 fail-fast，而流水线不会因为没装 web-sync 就长期全红。
          skip_web=0
          if [ "$has_sudo" != "yes" ]; then
            if ssh -F ~/.ssh/config -o BatchMode=yes -o ConnectTimeout=15 cn-target \
                 'sudo -n /usr/local/sbin/cn-web-sync --probe' >/dev/null 2>&1; then
              echo "远端可执行 cn-web-sync，前端可自动部署"
            else
              skip_web=1
            fi
          fi
          {
            echo "CN_REMOTE_HOME=$remote_home"
            echo "CN_HAS_SUDO=$has_sudo"
            echo "CN_SKIP_WEB=$skip_web"
            echo "CN_STAGE=$remote_home/cn-incoming"
          } >> "$GITHUB_ENV"
          if [ "$has_sudo" = "yes" ]; then
            echo "::notice title=远端能力::有 sudo，前端与运维加固都可自动完成"
          elif [ "$skip_web" -eq 0 ]; then
            echo "::notice title=远端能力::无 sudo，但已装 cn-web-sync，前端可自动部署"
          else
            echo "::warning title=前端不会自动部署::远端无 sudo 且未装 cn-web-sync，本轮显式跳过前端（CN_SKIP_WEB=1）。如果这次提交改了前端，线上页面仍是旧的。要恢复自动部署：让 root 执行 ops/deploy/install-web-sync.sh。数据库备份定时器与 nginx 路由同步同样因为无 sudo 而跳过。"
          fi

      - name: 上传产物
        # 目标机没有 rsync（install-server.sh 只装 JDK/PG/Redis/nginx），
        # 用 tar over ssh：两端只需要 tar，不留额外依赖。
        # 先清空暂存区，否则上一轮残留的旧 jar 会被当成新产物。
        run: |
          set -o pipefail
          ssh -F ~/.ssh/config cn-target "rm -rf '$CN_STAGE' && mkdir -p '$CN_STAGE'" 2>&1 | tee /tmp/cn-upload.log
          tar -C out -czf - . | ssh -F ~/.ssh/config cn-target "tar xzf - -C '$CN_STAGE'" 2>&1 | tee -a /tmp/cn-upload.log
          ssh -F ~/.ssh/config cn-target "du -sh '$CN_STAGE'; ls -la '$CN_STAGE/app'" 2>&1 | tee -a /tmp/cn-upload.log

      - name: 部署预检（不修改任何文件）
        # 部署最贵的错误是「做了一半才发现做不下去」。预检把三件事提前到第一次写盘之前：
        # 产物齐不齐、前端要不要换、当前身份有没有权限换。
        # CN_SKIP_WEB 由上一步的能力探测决定：0=严格（前端有变化而无权限就失败），
        # 1=显式跳过前端（已在注解里告警）。人工跑脚本时默认严格。
        run: |
          set -o pipefail
          ssh -F ~/.ssh/config cn-target \
            "CN_SKIP_WEB='$CN_SKIP_WEB' bash '$CN_STAGE/deploy-update.sh' --check '$CN_STAGE'" \
            2>&1 | tee /tmp/cn-precheck.log

      - name: 同步备份定时器
        # 备份脚本与定时器不属于「换产物」，单独一步：它不重启任何服务，
        # 失败也不该影响本次部署，所以放在重启之前，出错时更有辨识度。
        if: env.CN_HAS_SUDO == 'yes'
        run: |
          set -o pipefail
          ssh -F ~/.ssh/config cn-target "bash '$CN_STAGE/install-backup.sh'" 2>&1 | tee /tmp/cn-backup-install.log

      - name: 备份定时器（无 sudo 跳过）
        if: env.CN_HAS_SUDO != 'yes'
        run: |
          echo "::warning title=数据库备份未安装::远端无 sudo，install-backup.sh 未执行。线上当前没有 cn-db-backup.timer，请让 root 装一次，否则没有任何自动备份。"

      - name: 同步日志上限
        # journald 配额与 logrotate 规则由仓库维护，每次部署对齐一次（脚本幂等）。
        # continue-on-error：这是运维加固，不该成为业务上线的单点阻塞——日志规则没装上
        # 的后果是磁盘慢慢涨，而部署被跳过是服务停在旧版本，后者更急。
        # 失败仍会在运行记录里显示为警告，不会静默吞掉。
        if: env.CN_HAS_SUDO == 'yes'
        continue-on-error: true
        run: |
          set -o pipefail
          ssh -F ~/.ssh/config cn-target "bash '$CN_STAGE/install-logging.sh'" 2>&1 | tee /tmp/cn-logging-install.log

      - name: 换产物并重启
        run: |
          set -o pipefail
          # 直接用本次上传的那份脚本，不再往 ~/cn-deploy 装一份：
          # 两份副本迟早会漂移，而「部署脚本自己是不是最新」是最难查的那类问题。
          # 完整输出同时落到 $CN_REMOTE_HOME/cn/logs/deploy-last.log：
          # GitHub 的日志要登录才看得到，机器上留一份才能直接查上一次部署的结果。
          # 只换产物、不动数据库。install-server.sh 会 DROP SCHEMA，绝不能在这里调用。
          ssh -F ~/.ssh/config cn-target \
            "set -o pipefail; mkdir -p '$CN_REMOTE_HOME/cn/logs'; CN_SKIP_WEB='$CN_SKIP_WEB' bash '$CN_STAGE/deploy-update.sh' '$CN_STAGE' 2>&1 | tee '$CN_REMOTE_HOME/cn/logs/deploy-last.log'" \
            2>&1 | tee /tmp/cn-restart.log

      - name: 同步 nginx 文档路由
        # OpenAPI 的六条路由与 cn_docs 限流区都在 nginx-cn.conf 里。脚本幂等：
        # 内容没变不 reload，nginx -t 不过会回滚。需要 sudo，无 sudo 时跳过。
        if: env.CN_HAS_SUDO == 'yes'
        continue-on-error: true
        run: |
          set -o pipefail
          ssh -F ~/.ssh/config cn-target \
            "CN_HOME='$CN_REMOTE_HOME/cn' bash '$CN_STAGE/install-nginx.sh' '$CN_STAGE/nginx-cn.conf'" \
            2>&1 | tee /tmp/cn-nginx.log

      - name: 上线后冒烟
        # 只打公开接口，不需要任何凭据，也不写数据。
        # 部署脚本内部已经查过本机端口与 nginx→query 这条链路，这里再走一次
        # 「从外网域名进来」的完整链路——它和 127.0.0.1 不是同一条路。
        run: |
          set -uo pipefail
          fail=0
          for path in "/" "/core/actuator/health" "/query/api/v1/public/search/achievements?page=1&size=1"; do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "http://${{ secrets.CN_SSH_HOST }}${path}" || true)"
            printf '%-55s %s\n' "$path" "$code"
            [ "$code" = "200" ] || fail=1
          done
          [ "$fail" -eq 0 ] || echo "::error::外网入口自检未通过，请查看上面的状态码"
          exit "$fail"

      - name: 失败诊断
        # 日志要登录才能看，所以把每个步骤的尾部报错提升成注解，
        # 未登录也能通过 check-runs/annotations 接口读到真正的原因。
        if: failure()
        run: |
          for f in /tmp/cn-*.log /tmp/cn-key.err; do
            [ -f "$f" ] || continue
            echo "---- $f ----"
            tail -n 12 "$f" | tr -d '\r' | while IFS= read -r line; do
              echo "::error file=.github/workflows/deploy.yml::${line:0:400}"
            done
          done
