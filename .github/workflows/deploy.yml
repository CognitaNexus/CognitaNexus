name: build-and-deploy

# 推 dev 分支即构建三个服务与前端，传到目标机后由 deploy-update.sh 换产物并重启。
#
# 为什么在 GitHub 上构建而不是在服务器上：
# 目标机是 2 核，三个 Spring 服务的 Maven 构建加前端打包要三四十分钟，
# 且内存峰值不可控；runner 是 4 核且带缓存，本轮实测后端 63s、前端 16s。
#
# 为什么用命令行 ssh/rsync 而不是 appleboy 那两个 action：
# action 出错时只报「exit code 1」，密钥格式这类问题看不到原因；直接用命令行
# 可以先把密钥校验一遍，并把真实报错通过 ::error:: 注解暴露到 API 上。
on:
  push:
    branches: [dev]
  workflow_dispatch:

# 连续推送时只保留最新一次，避免两次部署交叉执行把产物换乱。
concurrency:
  group: deploy-dev
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 设置 JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: 构建后端
        # 先跳过测试换部署速度。要开质量门禁，把下面这行换成 ./mvnw -B verify
        # （verify 会跑 spotless 与 JaCoCo 80% 覆盖率门禁，耗时明显增加）。
        run: |
          set -o pipefail
          chmod +x mvnw
          ./mvnw -B -DskipTests package 2>&1 | tee /tmp/cn-build.log | tail -20

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 构建前端
        run: |
          set -o pipefail
          cd frontend
          npm ci --no-audit --no-fund 2>&1 | tail -5
          npm run build 2>&1 | tee /tmp/cn-web.log | tail -20

      - name: 整理产物
        # 每个服务只取一个可执行 jar：排除 *-sources.jar / *-javadoc.jar / *.jar.original，
        # 否则 cp 一次匹配到多个文件会变成「把多个文件拷进一个目标名」，直接失败。
        run: |
          set -eu
          mkdir -p out/app out/web
          pick() {
            f=$(find "services/$1-service/target" -maxdepth 1 -name "$1-service-*.jar" \
                  ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*.jar.original' | head -1)
            [ -n "$f" ] || { echo "未找到 $1-service 的可执行 jar" >&2; exit 1; }
            cp "$f" "out/app/$1-service.jar"
            echo "$1-service.jar <= $f"
          }
          pick core
          pick query
          pick ingestion
          cp -r frontend/dist/. out/web/
          # 部署脚本也随产物一起发下去：否则服务器上那份是首次安装时留下的旧副本，
          # 仓库里改了 deploy-update.sh 却不生效，排查起来很费时间。
          cp ops/deploy/deploy-update.sh out/deploy-update.sh
          du -sh out out/app out/web

      - name: 准备 SSH
        env:
          CN_SSH_HOST: ${{ secrets.CN_SSH_HOST }}
          CN_SSH_USER: ${{ secrets.CN_SSH_USER }}
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
          CN_SSH_PORT: ${{ secrets.CN_SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${CN_SSH_HOST:-}" ] || [ -z "${CN_SSH_USER:-}" ] || [ -z "${CN_SSH_KEY:-}" ]; then
            echo "::error::Secrets 缺失：需要 CN_SSH_HOST / CN_SSH_USER / CN_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          # 多行私钥从网页粘进 Secrets 极易受损：丢字符、带引号、换行被转成字面量 \n，
          # 报错统一是 error in libcrypto，看不出差别。所以按三种存法依次试：
          #   1) 原样（只去 CRLF）
          #   2) 字面量 \n 还原成真换行
          #   3) 一行 base64（推荐，粘贴时不可能被换行破坏）
          printf '%s\n' "$CN_SSH_KEY" > /tmp/key-raw
          tr -d '\r' < /tmp/key-raw > /tmp/key-crlf
          sed 's/\\n/\n/g' /tmp/key-crlf > /tmp/key-nl
          tr -d ' \t\r\n' < /tmp/key-nl | base64 -d > /tmp/key-b64 2>/dev/null || true
          # 解码结果若刚好缺末尾换行，ssh-keygen 会报 libcrypto: unsupported（已实测），
          # 补一个换行即可；多一个空行对解析无影响。
          [ -s /tmp/key-b64 ] && printf '\n' >> /tmp/key-b64 || true

          ok=""
          for cand in /tmp/key-crlf /tmp/key-nl /tmp/key-b64; do
            [ -s "$cand" ] || continue
            chmod 600 "$cand"
            if ssh-keygen -y -f "$cand" > ~/.ssh/cn_deploy.pub 2>/tmp/cn-key.err; then
              cp "$cand" ~/.ssh/cn_deploy
              ok="$cand"
              break
            fi
          done
          if [ -z "$ok" ]; then
            # 日志要登录才能看，所以把诊断信息做成注解（未登录也能通过 API 读到）。
            # sha256 只用于和本地正确私钥比对，不泄露内容。
            printf '::error::CN_SSH_KEY 三种存法都解析失败：%s\n' "$(tr '\n' ' ' < /tmp/cn-key.err | cut -c1-200)"
            printf '::error::诊断 字节=%s 行=%s 首行=[%s] 末行=[%s] sha256=%s\n' \
              "$(wc -c < /tmp/key-crlf)" \
              "$(wc -l < /tmp/key-crlf)" \
              "$(head -1 /tmp/key-crlf | cut -c1-30)" \
              "$(tail -1 /tmp/key-crlf | cut -c1-30)" \
              "$(sha256sum /tmp/key-crlf | cut -c1-32)"
            exit 1
          fi
          chmod 600 ~/.ssh/cn_deploy
          printf '::notice::私钥取自 %s，公钥指纹 %s\n' "$ok" "$(ssh-keygen -lf ~/.ssh/cn_deploy.pub | awk '{print $2}')"
          {
            echo "Host cn-target"
            echo "  HostName $CN_SSH_HOST"
            echo "  User $CN_SSH_USER"
            echo "  Port ${CN_SSH_PORT:-22}"
            echo "  IdentityFile ~/.ssh/cn_deploy"
            echo "  IdentitiesOnly yes"
            echo "  StrictHostKeyChecking accept-new"
            echo "  UserKnownHostsFile ~/.ssh/known_hosts"
          } > ~/.ssh/config
          chmod 600 ~/.ssh/config
          # 15 秒内连不上就当场失败，而不是挂到 job 超时
          ssh -F ~/.ssh/config -o ConnectTimeout=15 -o BatchMode=yes cn-target 'echo "已连上 $(hostname)"'

      - name: 上传产物
        # rsync 带 --delete 清掉上一次的残留，避免旧 jar 被误当成新产物。
        # 注意源写成 out/ 而不是 out，才能把 app/ 与 web/ 直接铺到目标目录下。
        run: |
          set -o pipefail
          rsync -az --delete -e "ssh -F $HOME/.ssh/config" out/ cn-target:/home/ubuntu/cn-incoming/ 2>&1 | tee /tmp/cn-upload.log
          ssh -F ~/.ssh/config cn-target 'ls -la /home/ubuntu/cn-incoming /home/ubuntu/cn-incoming/app'

      - name: 更新部署脚本并重启服务
        run: |
          set -o pipefail
          ssh -F ~/.ssh/config cn-target 'bash -s' <<'REMOTE' 2>&1 | tee /tmp/cn-restart.log
          set -e
          # 先更新部署脚本自身，再执行它（脚本已在本次上传的产物里）。
          if [ -f /home/ubuntu/cn-incoming/deploy-update.sh ]; then
            install -m 755 /home/ubuntu/cn-incoming/deploy-update.sh /home/ubuntu/cn-deploy/deploy-update.sh
          fi
          # 只换产物、不动数据库。install-server.sh 会 DROP SCHEMA，绝不能在这里调用。
          bash /home/ubuntu/cn-deploy/deploy-update.sh /home/ubuntu/cn-incoming
          REMOTE

      - name: 失败诊断
        # 日志要登录才能看，所以把每个步骤的尾部报错提升成注解，
        # 未登录也能通过 check-runs/annotations 接口读到真正的原因。
        if: failure()
        run: |
          for f in /tmp/cn-*.log /tmp/cn-key.err; do
            [ -f "$f" ] || continue
            echo "---- $f ----"
            tail -n 12 "$f" | tr -d '\r' | while IFS= read -r line; do
              echo "::error file=.github/workflows/deploy.yml::${line:0:400}"
            done
          done
