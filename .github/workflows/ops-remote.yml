name: ops-remote

# 应急运维通道。只在 ops/remote 分支上触发，不参与 dev 的构建与部署。
#
# 为什么需要它：2026-10-21 起，常用网络出口（代理节点）封了 22 端口，
# 本地 ssh 无法连目标机，但 GitHub runner 的出口可以。于是把「需要在目标机
# 上敲一次的命令」放进 ops/remote/ 下的脚本，由 runner 通过 ssh 执行。
#
# 用法：把动作写成 ops/remote/<脚本>.sh（幂等、自带自检输出），登记到
# ops/remote/manifest.txt，推送 ops/remote 分支即可。
#
# 结论怎么看：完整输出会回传到 ops/log 分支（git fetch 即可读），
# 关键几行同时写成 ::notice:: 注解——未登录也能通过 API 读到。

on:
  push:
    branches: [ops/remote]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ops-remote
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 准备 SSH
        env:
          CN_SSH_HOST: ${{ secrets.CN_SSH_HOST }}
          CN_SSH_USER: ${{ secrets.CN_SSH_USER }}
          CN_SSH_KEY: ${{ secrets.CN_SSH_KEY }}
          CN_SSH_PORT: ${{ secrets.CN_SSH_PORT }}
        run: |
          set -euo pipefail
          if [ -z "${CN_SSH_HOST:-}" ] || [ -z "${CN_SSH_USER:-}" ] || [ -z "${CN_SSH_KEY:-}" ]; then
            echo "::error::Secrets 缺失：需要 CN_SSH_HOST / CN_SSH_USER / CN_SSH_KEY"
            exit 1
          fi
          mkdir -p ~/.ssh
          # 私钥在 Secret 里可能是原样多行、字面量 \n、或缺首尾标识，
          # 与 deploy.yml 同样的三种存法依次试，命中即用。
          printf '%s\n' "$CN_SSH_KEY" > /tmp/key-raw
          tr -d '\r' < /tmp/key-raw > /tmp/key-crlf
          sed 's/\\n/\n/g' /tmp/key-crlf > /tmp/key-nl
          if ! grep -q 'BEGIN .*PRIVATE KEY' /tmp/key-nl; then
            {
              echo '-----BEGIN OPENSSH PRIVATE KEY-----'
              cat /tmp/key-nl
              echo '-----END OPENSSH PRIVATE KEY-----'
            } > /tmp/key-wrap
          fi
          ok=""
          for cand in /tmp/key-crlf /tmp/key-nl /tmp/key-wrap; do
            [ -s "$cand" ] || continue
            chmod 600 "$cand"
            if ssh-keygen -y -f "$cand" > /dev/null 2>/tmp/key.err; then
              cp "$cand" ~/.ssh/cn_deploy
              ok="$cand"
              break
            fi
          done
          if [ -z "$ok" ]; then
            printf '::error::CN_SSH_KEY 解析失败：%s\n' "$(tr '\n' ' ' < /tmp/key.err | cut -c1-180)"
            exit 1
          fi
          chmod 600 ~/.ssh/cn_deploy
          printf 'Host cn-target\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/cn_deploy\n  IdentitiesOnly yes\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 15\n' \
            "$CN_SSH_HOST" "$CN_SSH_USER" "${CN_SSH_PORT:-22}" > ~/.ssh/config
          chmod 600 ~/.ssh/config
          echo "私钥取自 $ok" | tee -a /tmp/ops-remote.log
          ssh -F ~/.ssh/config -o ConnectTimeout=15 -o BatchMode=yes cn-target 'echo 已连上 $(hostname)' 2>&1 | tee -a /tmp/ops-remote.log

      - name: 执行远端脚本
        run: |
          status=0
          while IFS= read -r s; do
            case "$s" in ''|\#*) continue ;; esac
            echo "===== 执行 $s =====" | tee -a /tmp/ops-remote.log
            # -n 必须加：ssh 若不读 stdin 会吞掉 while 循环的清单流
            if ssh -F ~/.ssh/config -o BatchMode=yes -o ConnectTimeout=15 -n cn-target \
                 'bash -s -- 8443' < "ops/remote/$s" >> /tmp/ops-remote.log 2>&1; then
              echo "[$s] 退出码 0" | tee -a /tmp/ops-remote.log
            else
              status=$?
              echo "[$s] 退出码 $status" | tee -a /tmp/ops-remote.log
              break
            fi
          done < ops/remote/manifest.txt
          tail -50 /tmp/ops-remote.log || true
          exit "$status"

      - name: 回传日志到 ops/log 分支
        # 日志文件在 runner 上、job 结束就没了；而登录才能看 workflow 日志。
        # 推到 ops/log 分支后，本地 git fetch 就能读，排查不用再猜。
        if: always()
        run: |
          set -euo pipefail
          mkdir -p /tmp/relay && cd /tmp/relay
          git init -q
          git checkout -q -b ops/log
          cp /tmp/ops-remote.log ./ops-remote.log 2>/dev/null || echo "本轮没有产生日志" > ./ops-remote.log
          printf 'commit=%s\nrun=%s/%s\n时间=%s\n' \
            "${GITHUB_SHA}" "${GITHUB_REPOSITORY}" "${GITHUB_RUN_ID}" "$(date -u +%FT%TZ)" > meta.txt
          git -c user.name=ci-relay -c user.email=ci@localhost add .
          git -c user.name=ci-relay -c user.email=ci@localhost commit -q -m "远端执行日志 ${GITHUB_SHA:0:7}"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" HEAD:ops/log
          echo "日志已回传到 ops/log 分支"
