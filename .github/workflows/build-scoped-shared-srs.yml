name: Check and build current SRS candidate
on:
  pull_request:
    paths: ['docs/**', 'scripts/docs/**', '.github/workflows/**', 'README.md', 'AGENTS.md']
  push:
    branches: [main]
    paths: ['docs/**', 'scripts/docs/**', '.github/workflows/**', 'README.md', 'AGENTS.md']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  document-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install document tooling
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc libreoffice-writer poppler-utils fonts-noto-cjk graphviz plantuml librsvg2-bin
      - name: Read-only documentation checks
        run: |
          python3 scripts/docs/verify_scoped_srs.py
          python3 scripts/docs/check_documentation.py
          env -u DISPLAY plantuml -charset UTF-8 -checkonly $(find docs/uml -name '*.puml')
      - name: Build into temporary directory
        run: bash scripts/docs/build_current_word.sh /tmp/current-srs-qa
      - name: Render Word (layout smoke check only)
        run: |
          libreoffice -env:UserInstallation=file:///tmp/lo-current-qa --headless --convert-to pdf --outdir /tmp/current-srs-qa /tmp/current-srs-qa/*.docx
          pdfinfo /tmp/current-srs-qa/*.pdf
          pdftoppm -f 1 -l 1 -scale-to 1200 -png -singlefile /tmp/current-srs-qa/*.pdf /tmp/current-srs-qa/first
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: current-srs-document-qa
          path: /tmp/current-srs-qa/
          if-no-files-found: warn
