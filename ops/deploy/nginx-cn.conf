# CognitaNexus 生产站点配置。
#
# 三条代理前缀必须与 frontend/vite.config.ts 的 proxyKey 保持一致（/core、/ingest、/query），
# 否则「开发时正常、部署后 404」：前端代码里写死的是这三条同源前缀，代理层少一条就断一路。
#
# location 与 proxy_pass 尾部都带斜杠，等于剥掉前缀再转发：
#   /core/api/v1/auth/csrf  →  http://127.0.0.1:8081/api/v1/auth/csrf
# OpenAPI 文档的访问限流区。
#
# limit_req_zone 只能写在 http 上下文。本文件被 include 进 nginx.conf 的 http 块，
# 所以 server 块之前的指令正好落在 http 上下文——不要把它挪进 server 里，nginx -t 会直接报错。
#
# 30r/m 约合每 2 秒 1 次：文档是给人读、给工具导入的，本来就不该高频访问。
# burst 20 是给 Swagger UI 留的——页面打开时会一次拉 swagger-initializer.js、
# index.css、favicon 等若干个静态文件，按 1 次/2 秒卡会变成页面缺样式。
limit_req_zone $binary_remote_addr zone=cn_docs:10m rate=30r/m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # 前端产物必须放在 /var/www 之类的中性路径，不能放 /home/ubuntu：
    # 家目录默认是 750，nginx worker 以 www-data 运行，stat() 会直接 Permission denied。
    root /var/www/cn;
    index index.html;

    # 认领材料与头像走业务接口上传，Spring 默认只收 1MB 单文件；
    # 这里放宽到 20m，同时要在 cn-env.sh 里把 multipart 上限一起调大，
    # 只改一侧的后果是「nginx 放行了，Spring 返回 413」。
    client_max_body_size 20m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    access_log /var/log/nginx/cn-access.log;
    error_log  /var/log/nginx/cn-error.log;

    # 带内容哈希的静态资源可以长缓存；index.html 不能缓存，否则改版后用户拿到旧壳。
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /core/ {
        proxy_pass http://127.0.0.1:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /ingest/ {
        proxy_pass http://127.0.0.1:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 采集管理里触发一轮抓取是同步等待上游返回的，Crossref 那一步可能跑几十秒。
        proxy_read_timeout 120s;
    }

    location /query/ {
        proxy_pass http://127.0.0.1:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # ────────────────────────────────────────────────────────────────────────
    # OpenAPI 契约与 Swagger UI：匿名可读，单独限流。
    #
    # 这两个路径必须排在 /core/、/query/、/ingest/ 之外单独写：限流只能作用在这几条上，
    # 若并进上面的通用代理，正常的业务请求也会被 30r/m 卡住。
    #
    # 前缀匹配一次覆盖两种形态：/core/v3/api-docs 与 /core/v3/api-docs.yaml、
    # /core/swagger-ui.html 与 /core/swagger-ui/index.html。nginx 对带 URI 的
    # proxy_pass 做「前缀替换」，所以 /core/v3/api-docs.yaml → 127.0.0.1:8081/v3/api-docs.yaml，
    # 不会多一层也不会漏一层。
    # ────────────────────────────────────────────────────────────────────────

    location /core/v3/api-docs {
        limit_req zone=cn_docs burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /core/swagger-ui {
        limit_req zone=cn_docs burst=20 nodelay;
        proxy_pass http://127.0.0.1:8081/swagger-ui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /query/v3/api-docs {
        limit_req zone=cn_docs burst=20 nodelay;
        proxy_pass http://127.0.0.1:8083/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /query/swagger-ui {
        limit_req zone=cn_docs burst=20 nodelay;
        proxy_pass http://127.0.0.1:8083/swagger-ui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ingest/v3/api-docs {
        limit_req zone=cn_docs burst=20 nodelay;
        proxy_pass http://127.0.0.1:8082/v3/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /ingest/swagger-ui {
        limit_req zone=cn_docs burst=20 nodelay;
        proxy_pass http://127.0.0.1:8082/swagger-ui;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 前端是 createWebHistory 模式，任何未命中的路径都要回落到 index.html，
    # 否则直接访问 /search 或刷新详情页会得到 nginx 404。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
