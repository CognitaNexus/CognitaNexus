server:
  port: 8082
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: ingestion-service
  profiles:
    active: local
  task:
    scheduling:
      # 默认调度线程池只有 1 个线程。本服务已有采集推进（fixedDelay 2000ms），又加了引用补水
      # （fixedDelay 30min）。共用单线程时，前者会长期占住唯一线程，后者被无限期推迟且不报错——
      # 表现为「定时任务静默不执行」，日志上完全看不出来。
      pool:
        size: ${CN_SCHEDULING_POOL_SIZE:4}

  datasource:
    # 运行账号：仅 DML，无 DDL 权限（架构 §12.1）
    url: jdbc:postgresql://127.0.0.1:5432/ingestion_db
    username: ingestion_app
    password: ${CN_INGESTION_DB_PASSWORD:cn_ingestion_app_dev}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: ingestion-pool
      # 强制自定义执行计划。JDBC 的同一个 PreparedStatement 在第 6 次执行时会从「按实际参数
      # 生成计划」切到「通用计划」，而这些查询的参数区分度极高（领域热度从 50 条到 7000 条），
      # 通用计划按均值估算行数，实测把一条 18ms 的领域统计查询拖到 262ms（14 倍），
      # 领域洞察页因此稳定停在 2 秒以上。改由服务端每次按实际参数生成计划。
      connection-init-sql: SET plan_cache_mode = force_custom_plan

  flyway:
    enabled: true
    url: jdbc:postgresql://127.0.0.1:5432/ingestion_db
    user: ingestion_owner
    password: ${CN_INGESTION_DB_OWNER_PASSWORD:cn_ingestion_owner_dev}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # 采集侧只用到可淘汰缓存：限流计数与抓取去抖。不使用 redis-session。
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      password: ${CN_CACHE_REDIS_PASSWORD:cn_cache_local_dev}
      timeout: 2s
      lettuce:
        pool:
          max-active: 8
          max-idle: 4

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    arg-name-based-constructor-auto-mapping: true
    default-fetch-size: 100
    default-statement-timeout: 15
  # 自定义类型处理器必须显式声明扫描包，否则不会被注册（starter 默认不扫描业务包）。
  # 漏配的后果不是「报错说缺处理器」，而是取结果时按 Object 处理并把 java.sql.Array
  # 直接塞给 String[] 构造参数，表现为反射层的 argument type mismatch，很难从消息看出根因。
  type-handlers-package: com.cognitanexus.ingestion

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

cn:
  internal:
    # 本服务在内部端点被调用时用于校验对端身份的令牌（core 投递事件、运维脚本）。
    # 变量名不复用 CN_CORE_SERVICE_TOKEN：那个名字经宽松绑定会命中 cn.core.service-token
    # （本服务调 core 时出示的令牌），在共享 EnvironmentFile 下会把出站令牌一起改掉。
    service-tokens:
      core: ${CN_INGESTION_INBOUND_CORE_TOKEN:cn_core_service_dev}
  core:
    base-url: ${CN_CORE_BASE_URL:http://127.0.0.1:8081}
    # 以什么身份调用 core 的内部接口；core 侧按此名查对应令牌
    service-name: ingestion
    service-token: ${CN_INGESTION_SERVICE_TOKEN:cn_ingestion_service_dev}
    connect-timeout: 3s
    read-timeout: 20s
  collect:
    # 交接批次规模：架构 §6.2 建议初始 100 条、请求体不超过 2 MiB，均为可调工程默认值
    batch-size: 100
    max-batch-bytes: 2097152
    # 单次任务最多抓取多少页，防止误配 query 导致无限抓取
    max-pages-per-run: 40
    lease-seconds: 120
    worker-enabled: true
    worker-interval-ms: 2000
    max-handoff-attempts: 8
    # 自身指数退避的上限（秒）。自己的推算是保守估计，没必要等更久。
    max-backoff-seconds: 300
    # 来源在 Retry-After 里明示的等待时间的上限（秒，默认 12 小时）。
    # 与上一项分开：对方按日配额算出来的等待可能是十几小时，用 300 秒截它等于在限流期间继续敲门。
    # 保留上限是为了挡住解析异常的响应头把任务冻结几十天。
    max-retry-after-seconds: 43200
    # 连续失败熔断阈值：达到后任务转 FAILED，不再自动重试，等人工核查来源。
    # 按连续次数而非累计次数，跑了很久偶发失败一次的任务不会被误熔断。
    max-consecutive-failures: 20
    adapter:
      # 采集器对上游的自我标识；Crossref 与 OpenAlex 都要求可联系的 UA
      user-agent: ${CN_COLLECT_USER_AGENT:CognitaNexus/0.2 (mailto:cn-admin@example.edu.cn)}
      # OpenAlex 免费 API key。留空则匿名调用：每日预算 0.1 美元，且与同出口 IP 的其他用户共享，
      # 额度耗尽后接口返回 403 并在 body 里说明 budget 已用完（不是来源故障）。
      # 注册后每日预算 10 倍（1 美元）、每秒 30 次；补满全站引用约需 10 美分，占日额度十分之一。
      # key 只从环境变量读，不写进仓库。
      api-key: ${CN_OPENALEX_API_KEY:}
      request-timeout: 20s
      max-response-bytes: 4194304
    citation:
      # 引用网络补水。采集每天新增约 2700 条公开论文，不自动补的话覆盖率每天都在往回掉：
      # 手动补到 81% 之后什么都不做，一周就退回一半。补水本身极便宜（300 篇约 12 次请求）。
      worker:
        enabled: ${CN_CITATION_WORKER_ENABLED:true}
        # 30 分钟一轮：一天 48 轮 × 300 篇 = 14400 篇的处理能力，远大于每日新增。
        # 单轮失败不影响整体，下一轮自动接上（候选查询只挑从未取过引用的成果，天然幂等）。
        interval-ms: 1800000
        # 启动后先等 3 分钟：把启动瞬间的数据库连接与迁移让给主流程，别让首个调度抢在前面。
        initial-delay-ms: 180000
        works-per-tick: 300
  paging:
    default-page-size: 20
    max-page-size: 100
    max-offset: 10000

# OpenAPI 文档（部署前功能项）。文档只含路径、参数与响应结构，不含任何业务数据。
# 只文档化 /api/v1/**：/internal/v1/** 是服务间调用，写进文档会诱导外部照着调，
# 得到 401 后还要来问「文档说可以」。
springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/v1/**
  swagger-ui:
    path: /swagger-ui.html
    # 页面挂在 nginx 的 /ingest/swagger-ui/ 下，而同源真实文档地址是 /ingest/v3/api-docs。
    # 用相对路径 ../v3/api-docs 同时满足两种访问方式：经代理时解析成 /ingest/v3/api-docs，
    # 直连 8082 时解析成 /v3/api-docs。写死绝对路径会有一边取不到 JSON、界面空白。
    url: ../v3/api-docs
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.cognitanexus: INFO
    org.springframework.jdbc.core: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
