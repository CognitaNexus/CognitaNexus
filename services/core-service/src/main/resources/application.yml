server:
  port: 8081
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: core-service
  profiles:
    active: local

  datasource:
    # 运行账号：仅 DML，无 DDL 权限（架构 §12.1）
    url: jdbc:postgresql://127.0.0.1:5432/core_db
    username: core_app
    password: ${CN_CORE_DB_PASSWORD:cn_core_app_dev}
    hikari:
      maximum-pool-size: 12
      minimum-idle: 2
      connection-timeout: 5000
      pool-name: core-pool
      # 强制自定义执行计划。JDBC 的同一个 PreparedStatement 在第 6 次执行时会从「按实际参数
      # 生成计划」切到「通用计划」，而这些查询的参数区分度极高（领域热度从 50 条到 7000 条），
      # 通用计划按均值估算行数，实测把一条 18ms 的领域统计查询拖到 262ms（14 倍），
      # 领域洞察页因此稳定停在 2 秒以上。改由服务端每次按实际参数生成计划。
      connection-init-sql: SET plan_cache_mode = force_custom_plan

  flyway:
    enabled: true
    # 迁移账号与运行账号分离
    url: jdbc:postgresql://127.0.0.1:5432/core_db
    user: core_owner
    password: ${CN_CORE_DB_OWNER_PASSWORD:cn_core_owner_dev}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # 会话存储于 redis-session 实例（架构 §8.1）
  data:
    redis:
      host: 127.0.0.1
      port: 6379
      password: ${CN_SESSION_REDIS_PASSWORD:cn_session_local_dev}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  session:
    store-type: redis
    timeout: 2h
    redis:
      namespace: 'cn:local:core:session'

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

  task:
    scheduling:
      # 默认调度线程池只有 1 个线程。本服务已有 outbox 投递（fixedDelay 800ms），本次又加了
      # 注销扫描与保留期清理；共用单线程时，一个慢任务会让其余任务排队，而排队中的任务
      # 不会报错——表现为「定时任务静默不执行」，排查成本极高。
      pool:
        size: ${CN_SCHEDULING_POOL_SIZE:4}
      thread-name-prefix: cn-sched-

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # 查询行对象使用 record，按参数名自动装配构造器
    arg-name-based-constructor-auto-mapping: true
    default-fetch-size: 100
    default-statement-timeout: 10
  # 自定义类型处理器必须显式声明扫描包，starter 不扫描业务包。
  # core_patent 的 ipc_codes / applicant_names 是 text[]，行对象字段为 String[]，
  # 读路径靠这个注册拿到 StringArrayTypeHandler；漏配不会报「缺处理器」，
  # 而是把 java.sql.Array 当 Object 直接塞进构造参数，表现为 argument type mismatch。
  type-handlers-package: com.cognitanexus.core.platform.persistence

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

cn:
  bootstrap:
    # 首个平台管理员引导。仅在库中不存在活跃平台管理员时执行一次，之后自动跳过。
    # 口令必须由环境变量 CN_BOOTSTRAP_ADMIN_PASSWORD 覆盖；此处默认值仅供本地开发。
    platform-admin-username: ${CN_BOOTSTRAP_ADMIN_USERNAME:cnadmin}
    platform-admin-password: ${CN_BOOTSTRAP_ADMIN_PASSWORD:cn-admin-Dev-2026}
    platform-admin-display-name: ${CN_BOOTSTRAP_ADMIN_DISPLAY_NAME:平台管理员}
  internal:
    service-tokens:
      ingestion: ${CN_INGESTION_SERVICE_TOKEN:cn_ingestion_service_dev}
      query: ${CN_QUERY_SERVICE_TOKEN:cn_query_service_dev}
  outbox:
    # 投递器：领取待投递事件并推送至查询服务
    dispatcher-enabled: true
    batch-size: 200
    max-attempts: 12
    consumer-endpoints:
      query: ${CN_QUERY_INBOX_URL:http://127.0.0.1:8083/internal/v1/inbox/batches}
  governance:
    # 自动合并只允许稳定标识一致且证据相容；其余一律产生候选
    auto-merge-requires-stable-identifier: true
  storage:
    claim-evidence-dir: ${CN_CLAIM_EVIDENCE_DIR:D:/dev-tools/cn-storage/claim-evidence}
    # 头像与认领材料分目录：前者匿名可读、后者必须鉴权。放在同一个目录里，
    # 任何一次「把目录挂成静态资源」的运维改动都会顺带公开认领材料。
    scholar-avatar-dir: ${CN_SCHOLAR_AVATAR_DIR:D:/dev-tools/cn-storage/scholar-avatar}
  paging:
    default-page-size: 20
    max-page-size: 100
    max-offset: 10000
  closure:
    # 注销冷静期扫描。到期即执行，不再等管理员手动点——页面承诺的是「7 天后生效」。
    # 想否决必须在 effective_at 之前裁决，过期后这里会直接停用账号。
    sweep-interval-ms: ${CN_CLOSURE_SWEEP_INTERVAL_MS:3600000}
    sweep-initial-delay-ms: ${CN_CLOSURE_SWEEP_INITIAL_DELAY_MS:60000}
  identity:
    # 会话撤销表保留窗口。必须长于会话最大寿命，否则被撤销的旧会话会在记录被删后重新可用。
    revocation-retention-days: ${CN_REVOCATION_RETENTION_DAYS:30}
    retention-interval-ms: ${CN_RETENTION_INTERVAL_MS:86400000}
    retention-initial-delay-ms: ${CN_RETENTION_INITIAL_DELAY_MS:300000}

# OpenAPI 文档（部署前功能项）。文档只含路径、参数与响应结构，不含任何业务数据。
# 只文档化 /api/v1/**：/internal/v1/** 是服务间调用，写进文档会诱导外部照着调，
# 得到 401 后还要来问「文档说可以」。
springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/v1/**
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.cognitanexus: INFO
    org.springframework.jdbc.core: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
