server:
  port: 8083
  shutdown: graceful
  error:
    include-message: never
    include-stacktrace: never
    include-binding-errors: never

spring:
  application:
    name: query-service
  profiles:
    active: local

  datasource:
    # 运行账号：仅 DML，无 DDL 权限（架构 §12.1）
    url: jdbc:postgresql://127.0.0.1:5432/query_db
    username: query_app
    password: ${CN_QUERY_DB_PASSWORD:cn_query_app_dev}
    hikari:
      maximum-pool-size: 16
      minimum-idle: 3
      connection-timeout: 5000
      pool-name: query-pool
      # 强制自定义执行计划。JDBC 的同一个 PreparedStatement 在第 6 次执行时会从「按实际参数
      # 生成计划」切到「通用计划」，而这些查询的参数区分度极高（领域热度从 50 条到 7000 条），
      # 通用计划按均值估算行数，实测把一条 18ms 的领域统计查询拖到 262ms（14 倍），
      # 领域洞察页因此稳定停在 2 秒以上。改由服务端每次按实际参数生成计划。
      #
      # 禁用并行查询（2026-10-18）。PostgreSQL 在 Windows 上每次执行并行计划都要为 Gather 节点
      # 拉起 worker 进程，实测单次 1～2 秒：qry_contribution_org 涨到 18.9 万行后规划器开始给
      # 统计计数选并行计划，统计概览从 381ms 劣化到 4～8 秒；合作网络扩边查询同样中招。
      # 同一条 NOT EXISTS 计数禁并行后 44～84ms（串行扫描本身不慢，慢的是进程创建）。
      # 本规模（单代 <20 万行）并行没有收益，明确关掉；若迁到 fork 便宜的系统可重新评估。
      connection-init-sql: SET plan_cache_mode = force_custom_plan; SET max_parallel_workers_per_gather = 0

  flyway:
    enabled: true
    # 迁移账号与运行账号分离
    url: jdbc:postgresql://127.0.0.1:5432/query_db
    user: query_owner
    password: ${CN_QUERY_DB_OWNER_PASSWORD:cn_query_owner_dev}
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  # 可丢弃派生缓存使用 redis-cache 实例（架构 §8.1）。
  # 会话类数据不在本服务，因此这里只连 6380，不连 redis-session。
  data:
    redis:
      host: 127.0.0.1
      port: 6380
      password: ${CN_CACHE_REDIS_PASSWORD:cn_cache_local_dev}
      timeout: 2s
      lettuce:
        pool:
          max-active: 16
          max-idle: 8

  jackson:
    default-property-inclusion: non_null
    deserialization:
      fail-on-unknown-properties: false

mybatis:
  configuration:
    map-underscore-to-camel-case: true
    # 查询行对象使用 record，按参数名自动装配构造器
    arg-name-based-constructor-auto-mapping: true
    default-fetch-size: 200
    default-statement-timeout: 20

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

cn:
  internal:
    service-tokens:
      # 「core 调 query 时该出示什么」。
      #
      # 变量名必须与 core 出站用的 CN_QUERY_SERVICE_TOKEN 分开，不能直接复用它：
      # 三个服务共用同一份 EnvironmentFile，而 CN_QUERY_SERVICE_TOKEN 在 core 里
      # 是「我调 query 时出示的令牌」、在 query 里是「我调 core 时出示的令牌」，
      # 同名不同义。要区分开，就只能让入站期望有自己的变量。
      #
      # 值必须等于 core 侧 cn.internal.service-tokens.query，也就是 core 投递给
      # query 时实际带的那个令牌；两侧不一致的表现只是 403 与水位不动。
      core: ${CN_QUERY_INBOUND_CORE_TOKEN:cn_query_service_dev}
  core:
    # 公开查询每次都需要向 core 核实权威公开水位（架构 §7.2）。
    # 超时必须显式设置：屏障校验在公开请求的必经路径上，缺读超时会让 core 的慢响应拖垮公开查询线程。
    base-url: ${CN_CORE_BASE_URL:http://127.0.0.1:8081}
    service-name: query
    service-token: ${CN_QUERY_SERVICE_TOKEN:cn_query_service_dev}
    connect-timeout: 2s
    request-timeout: 3s
  projection:
    # 必须与 core 的 cn.outbox.consumer-endpoints.query 键一致，否则事件会以别的 consumerId 落库，
    # 表现为「收到了但水位不动」。
    consumer-id: query
    publish-batch-per-batch: 500
    failure-backoff-seconds: 5
    # 单篇成果参与建边的作者上限。超过上限时隔离事件并记录，不做静默截断（架构 §9.3）。
    max-authors-per-achievement-for-edges: 200
    worker-enabled: true
    worker-interval-ms: 2000
    # 图与检索的初始上限：可调起始值，不是性能承诺，须在压测后按测量结果调整（架构 §9.3、§13.2）
    graph-max-nodes: 20000
    graph-max-edges: 100000
    graph-budget-millis: 1000
    search-max-offset: 10000
    search-default-page-size: 20
    search-max-page-size: 100

# OpenAPI 文档（部署前功能项）。文档只含路径、参数与响应结构，不含任何业务数据。
# 只文档化 /api/v1/**：/internal/v1/** 是服务间调用，写进文档会诱导外部照着调，
# 得到 401 后还要来问「文档说可以」。
springdoc:
  api-docs:
    path: /v3/api-docs
  paths-to-match: /api/v1/**
  swagger-ui:
    path: /swagger-ui.html
    # 页面挂在 nginx 的 /query/swagger-ui/ 下，而同源真实文档地址是 /query/v3/api-docs。
    # 用相对路径 ../v3/api-docs 同时满足两种访问方式：经代理时解析成 /query/v3/api-docs，
    # 直连 8083 时解析成 /v3/api-docs。写死绝对路径会有一边取不到 JSON、界面空白。
    url: ../v3/api-docs
    operations-sorter: alpha
    tags-sorter: alpha

logging:
  level:
    root: INFO
    com.cognitanexus: INFO
    org.springframework.jdbc.core: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{36} - %msg%n"
