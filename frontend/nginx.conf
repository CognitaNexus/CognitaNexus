# nginx 站点配置（容器内 /etc/nginx/conf.d/default.conf）。
#
# 三个后端服务都经同源路径前缀代理，而不是让浏览器直连 8081/8082/8083：
#
#  1. 会话 Cookie 由核心服务下发，CSRF 采用「Cookie 与请求头双提交」。跨源会让这条校验
#     整体失效，而在生产为了开发方便放开 CORS，等于把这条放宽带上去。
#  2. 同源下前端不需要知道任何后端地址，部署时只改这份 nginx 配置，改不动前端产物。
#
# 与开发期 vite 代理的差别只有上游主机名（这里用 compose 服务名，开发期用 127.0.0.1）。
# 路径前缀约定完全一致，所以前端代码在两种环境下指向同一件事。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 静态资源带内容哈希，可以长缓存；index.html 绝不缓存，否则发布后用户会拿到旧的入口
    # 去请求已经删掉的旧 chunk，得到白屏。
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # 单页应用：未知路径交给前端路由处理，不要返回 nginx 的 404 页。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 核心服务 ----
    #
    # 三个 location 一律带结尾斜杠，这是有意的边界约束，不要为了「看起来整齐」去掉。
    # 它保证 location 是「路径段的前缀」而不是「字符串前缀」：/ingestion 这个页面路由
    # 不会被 /ingest 吃掉。开发期的 vite 代理曾因键写成不带边界的 /ingest，把 /ingestion
    # 当成 API 请求转发出去（重写成 /ion）并返回 500——站内点进去正常、刷新就挂。
    location /core/ {
        proxy_pass http://core-service:8081/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 认领材料上传的单文件上限是 10 MiB，这里留出余量给 multipart 封装。
        client_max_body_size 12m;
        proxy_read_timeout 60s;
    }

    # ---- 采集服务 ----
    location /ingest/ {
        proxy_pass http://ingestion-service:8082/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 手动驱动一次采集要等外部来源返回，给足超时；前端也会显示这是长操作。
        proxy_read_timeout 180s;
    }

    # ---- 查询服务 ----
    location /query/ {
        proxy_pass http://query-service:8083/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
