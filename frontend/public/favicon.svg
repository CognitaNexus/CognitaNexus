<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    站标：衬线 C 花押，圆环取「引文网络闭环」之意。
    配色与全局唯一强调色一致（styles.css 的 --accent: #1b4b8f），
    背景用纸面白而不是纯白，避免在浅色标签页里看不出边界。
  -->
  <rect width="32" height="32" rx="6" fill="#f7f6f2"/>
  <circle cx="16" cy="16" r="9.5" fill="none" stroke="#1b4b8f" stroke-width="2.6"/>
  <path d="M21.5 11.6 A7.2 7.2 0 1 0 21.5 20.4" fill="none" stroke="#1b4b8f" stroke-width="2.6" stroke-linecap="round"/>
</svg>
